<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Store — In5kNights</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <!-- IMPORTANT: styles.css is in the ROOT folder -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Skip Link -->
  <a href="#mainContent" class="skip-link">
    Skip to main content
  </a>

  <!-- =========================================================
       NAVBAR
       ========================================================= -->
  <nav class="navbar navbar-expand-lg navbar-forge sticky-top py-3">

    <div class="container">

      <!-- Logo -->
      <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="index.html"
      >
        <img
          src="mainlogo.png"
          alt=""
          class="brand-logo"
          aria-hidden="true"
        >

        <img
          src="mainname.png"
          alt="In5kNights"
          class="brand-wordmark"
        >
      </a>

      <!-- Mobile Navbar Button -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation -->
      <div class="collapse navbar-collapse" id="mainNav">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-2 mt-3 mt-lg-0">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link active"
              aria-current="page"
              href="store.html"
            >
              Store
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="upload-game.html">
              Sell Your Game
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">
              Dashboard
            </a>
          </li>

        </ul>

        <!-- Navbar Search -->
        <form
          class="d-flex me-lg-3 mb-3 mb-lg-0"
          role="search"
          id="navSearchForm"
        >
          <input
            class="form-control form-control-sm bg-dark text-light border-secondary"
            type="search"
            name="q"
            placeholder="Search games..."
            aria-label="Search"
          >
        </form>

        <!-- Navbar Actions -->
        <div class="d-flex align-items-center gap-3">

          <!-- Theme Button -->
          <button
            type="button"
            id="themeToggleBtn"
            class="theme-toggle-btn"
            aria-label="Toggle light and dark theme"
          >
            <i class="bi bi-sun"></i>
          </button>

          <!-- Cart -->
          <a
            href="cart.html"
            class="position-relative text-light"
            aria-label="View cart"
          >
            <i class="bi bi-cart3 fs-5"></i>

            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge"
              style="background-color: var(--accent-ember); font-size: 0.6rem;"
            >
              2
            </span>
          </a>

          <!-- Login -->
          <a
            href="login.html"
            class="btn btn-forge btn-sm px-3"
          >
            Log In
          </a>

        </div>

      </div>
    </div>
  </nav>


  <!-- =========================================================
       PAGE HEADER
       ========================================================= -->
  <header class="container pt-5 pb-3">

    <p class="eyebrow mb-1">
      Full catalog
    </p>

    <h1 class="mb-0">
      Browse the Store
    </h1>

  </header>


  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->
  <main
    id="mainContent"
    class="container pb-5"
  >

    <div class="row g-4">

      <!-- =====================================================
           FILTER SIDEBAR
           ===================================================== -->

          style="top: 90px;"
        >

          >

            <h5 class="mb-0">
              Filters
            </h5>

            <button

              id="resetFiltersBtn"
              class="btn btn-sm btn-outline-forge"
            >
              Reset
            </button>
