<!--
  =============================================================
  FILE: login.html
  PURPOSE: Combined login/signup page. Both forms are validated
  client-side (js/login.js), password fields get a show/hide
  toggle, and the signup password gets a live strength meter.
  Choosing Player vs Developer on signup determines where the
  demo sends you after "creating" the account.
  =============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In or Sign Up — In5kNights</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#mainContent" class="skip-link">Skip to main content</a>

  <nav class="navbar navbar-forge py-3">
    <div class="container d-flex justify-content-center position-relative">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="Images/mainlogo.png" alt="" class="brand-logo" aria-hidden="true">
        <img src="Images/mainname.png" alt="In5kNights" class="brand-wordmark">
      </a>
      <button type="button" id="themeToggleBtn" class="theme-toggle-btn position-absolute top-50 end-0 translate-middle-y me-3" aria-label="Toggle light and dark theme"><i class="bi bi-sun"></i></button>
    </div>
  </nav>

  <main id="mainContent" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-xl-5">
        <div class="panel p-4 p-md-5">

          <ul class="nav nav-tabs justify-content-center mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active px-4" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab" aria-controls="loginPane" aria-selected="true">Log In</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link px-4" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signupPane" type="button" role="tab" aria-controls="signupPane" aria-selected="false">Sign Up</button>
            </li>
          </ul>

          <div class="tab-content" id="authTabsContent">

            <!-- ============ LOG IN ============ -->
            <div class="tab-pane fade show active" id="loginPane" role="tabpanel" aria-labelledby="login-tab">
              <form id="loginForm" class="needs-validation" novalidate>
                <div class="mb-3">
                  <label for="loginEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="loginEmail" name="email" placeholder="you@example.com" required>
                  <div class="invalid-feedback">Enter a valid email address.</div>
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="loginPassword" name="password" placeholder="••••••••" required minlength="6">
                    <button class="btn btn-outline-forge" type="button" data-toggle-password="loginPassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    <div class="invalid-feedback">Enter your password (6+ characters).</div>
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small text-muted-custom" for="rememberMe">Remember me</label>
                  </div>
                  <a href="#" class="small" style="color: var(--accent-violet);">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-forge w-100 mb-3">Log In</button>
              </form>

              <div class="d-flex align-items-center gap-3 my-4">
                <hr class="flex-grow-1 divider-line">
                <span class="small text-muted-custom">or</span>
                <hr class="flex-grow-1 divider-line">
              </div>

              <button type="button" class="btn btn-outline-light w-100 mb-2" id="googleLoginBtn"><i class="bi bi-google me-2"></i>Continue with Google</button>
              <button type="button" class="btn btn-outline-light w-100" id="steamLoginBtn"><i class="bi bi-steam me-2"></i>Continue with Steam</button>
            </div>

            <!-- ============ SIGN UP ============ -->
            <div class="tab-pane fade" id="signupPane" role="tabpanel" aria-labelledby="signup-tab">
              <form id="signupForm" class="needs-validation" novalidate>

                <div class="mb-4">
                  <label class="form-label d-block">I'm signing up as a...</label>
                  <div class="account-toggle btn-group w-100" role="group" aria-label="Account type">
                    <input type="radio" class="btn-check" name="accountType" id="typePlayer" value="player" autocomplete="off" checked>
                    <label class="btn btn-toggle" for="typePlayer"><i class="bi bi-controller me-1"></i> Player</label>

                    <input type="radio" class="btn-check" name="accountType" id="typeDeveloper" value="developer" autocomplete="off">
                    <label class="btn btn-toggle" for="typeDeveloper"><i class="bi bi-code-slash me-1"></i> Developer</label>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="signupName" class="form-label">Display Name</label>
                  <input type="text" class="form-control" id="signupName" name="displayName" placeholder="How you'll appear on In5kNights" required>
                  <div class="invalid-feedback">Pick a display name.</div>
                </div>
                <div class="mb-3">
                  <label for="signupEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="signupEmail" name="email" placeholder="you@example.com" required>
                  <div class="invalid-feedback">Enter a valid email address.</div>
                </div>
                <div class="mb-2">
                  <label for="signupPassword" class="form-label">Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="signupPassword" name="password" placeholder="At least 8 characters" required minlength="8">
                    <button class="btn btn-outline-forge" type="button" data-toggle-password="signupPassword" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    <div class="invalid-feedback">Use at least 8 characters.</div>
                  </div>
                </div>
                <div class="mb-4">
                  <div class="pw-strength-track mb-1">
                    <div class="pw-strength-fill" id="pwStrengthFill"></div>
                  </div>
                  <span class="small text-muted-custom" id="pwStrengthLabel">Password strength</span>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="signupTerms" required>
                  <label class="form-check-label small text-muted-custom" for="signupTerms">
                    I agree to the Terms of Service and Privacy Policy.
                  </label>
                  <div class="invalid-feedback">You need to agree before creating an account.</div>
                </div>

                <button type="submit" class="btn btn-forge w-100">Create Account</button>
              </form>
            </div>
          </div>
        </div>

        <p class="text-center small text-muted-custom mt-4">
          <a href="index.html" class="text-muted-custom"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/games-data.js"></script>
  <script src="js/site.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
